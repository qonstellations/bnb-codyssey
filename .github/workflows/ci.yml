name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # templates.check.mjs imports backend services, so both need installing
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend

      - run: npm run lint
        working-directory: frontend
      - run: node src/engine/selfcheck.mjs
        working-directory: frontend
      - run: node src/shared/templates/templates.check.mjs
        working-directory: frontend
      - run: node src/features/results/histogram.check.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3001

# ponytail: backend `npm test` needs MongoDB and ~3 min under the rate limiter; run it locally
# with RATE_LIMITS=off before a release. Add a mongo service job if it starts getting skipped.
